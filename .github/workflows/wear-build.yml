# Started by hand only (workflow_dispatch). It builds the Wear OS app of wear/ (Compose for Wear OS, the service of the Data Layer) with the Android SDK of the runner, runs its unit
# tests and those of the Kotlin core, and keeps the debug APK for a week. It publishes nothing and signs nothing: the app has never run on a watch.

name: Wear OS app build check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the Wear OS app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit this run was started from (start the run from the branch or tag to build)
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon -ParmorWear test :wear:testDebugUnitTest :wear:assembleDebug

      - name: Keep the debug APK for a week
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
